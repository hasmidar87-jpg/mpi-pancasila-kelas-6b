<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MPI Makna Sila Pancasila | Kelas VI</title>
<style>
:root{--red:#b4232c;--navy:#17324d;--gold:#f6c84b;--cream:#fff9e9;--blue:#eaf4ff;--green:#16804a;--text:#202938}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:var(--text);background:linear-gradient(135deg,#fff8e8,#eaf4ff);line-height:1.55}
header{background:var(--red);color:white;border-bottom:6px solid var(--gold);padding:18px max(18px,calc((100vw - 1120px)/2));display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
header h1{font-size:clamp(1.2rem,3vw,1.8rem);margin:0}header p{margin:3px 0 0}.school{border-radius:99px;padding:8px 13px;background:white;color:var(--red);font-weight:800;font-size:.9rem}
main{max-width:1120px;margin:22px auto;padding:0 16px 32px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.nav button,.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:750;cursor:pointer;font-size:.95rem}.nav button{background:white;color:var(--navy);box-shadow:0 2px 8px #18324b12}.nav button.active{background:var(--navy);color:white}.btn{background:var(--red);color:white}.btn.alt{background:#e9eef4;color:var(--navy)}.btn.gold{background:var(--gold);color:#3e2d00}
button:focus-visible{outline:3px solid #2373d1;outline-offset:2px}.panel{background:#fff;border-radius:22px;padding:clamp(18px,4vw,32px);box-shadow:0 10px 30px #17324d12;min-height:390px}
h2{margin:0 0 12px;color:var(--red);font-size:clamp(1.4rem,3vw,2rem)}h3{color:var(--navy);margin:5px 0 8px}.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:22px;align-items:center}.hero-art{border-radius:20px;padding:24px;text-align:center;background:linear-gradient(145deg,#fff1b5,#ffdc7a)}.eagle{font-size:clamp(5rem,12vw,8rem);line-height:1.2}.lead{font-size:1.08rem}.tag{display:inline-block;background:#fff1c2;color:#79520a;padding:5px 10px;border-radius:99px;font-weight:800;font-size:.82rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card{border:2px solid #e5ebf1;border-radius:17px;padding:16px;display:flex;flex-direction:column;gap:9px;background:#fff}.symbol{font-size:3rem;text-align:center;background:var(--cream);border-radius:13px;padding:8px}.card p{margin:0}.card button{margin-top:auto}.note{padding:14px 16px;border-left:5px solid var(--gold);border-radius:10px;background:#f7fafc;margin-top:16px}.detail{padding:12px;background:#f5f9fc;border-radius:12px;line-height:1.6}.detail ul{padding-left:22px}
.activity{background:#f3f7fb;padding:16px;border-radius:16px;margin-top:14px}.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:14px 0}.option{border:2px solid #dce4ec;background:white;border-radius:12px;padding:12px;text-align:left;cursor:pointer;font-weight:650;line-height:1.4}.option.correct{border-color:var(--green);background:#e8f8ef}.option.wrong{border-color:var(--red);background:#fff0f0}.option:disabled{cursor:default}.feedback{font-weight:750;min-height:26px}.progress{height:9px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:12px 0}.progress span{display:block;height:100%;background:var(--gold)}label.check{display:block;padding:12px;background:white;border-radius:10px;margin:8px 0}
footer{text-align:center;padding:18px;color:#536071;font-size:.9rem}@media(max-width:700px){.hero{grid-template-columns:1fr}.panel{min-height:0}}
</style>
</head>
<body>
<header><div><h1>🇮🇩 MPI: Makna Sila Pancasila</h1><p>Pendidikan Pancasila • Kelas VI • Kurikulum Merdeka (Fase C)</p></div><div class="school">SD Negeri 7 Pakue Utara</div></header>
<main><nav class="nav" aria-label="Menu utama">
<button class="active" data-page="home">🏠 Beranda</button><button data-page="materi">📚 Materi</button><button data-page="aktivitas">🧩 Aktivitas</button><button data-page="kuis">✍️ Kuis</button><button data-page="refleksi">🌱 Refleksi</button>
</nav><section class="panel" id="content" aria-live="polite"></section></main>
<footer>Belajar dengan gembira, amalkan Pancasila setiap hari!<br>Media pembelajaran mandiri — dapat digunakan tanpa koneksi internet.</footer>
<script>
const sila=[
{n:1,nama:"Ketuhanan Yang Maha Esa",lambang:"⭐",simbol:"Bintang",makna:"Mengakui dan menghormati Tuhan Yang Maha Esa serta menghargai kebebasan setiap orang untuk menjalankan ibadah sesuai agama dan kepercayaannya.",contoh:["Berdoa sebelum belajar sesuai agama masing-masing.","Menghormati teman yang sedang beribadah.","Tidak memaksakan keyakinan kepada orang lain."]},
{n:2,nama:"Kemanusiaan yang Adil dan Beradab",lambang:"🔗",simbol:"Rantai",makna:"Mengakui persamaan derajat, hak, dan kewajiban manusia serta memperlakukan orang lain secara adil, sopan, dan penuh kepedulian.",contoh:["Menolong teman yang kesulitan.","Tidak mengejek perbedaan fisik atau latar belakang.","Meminta maaf jika melakukan kesalahan."]},
{n:3,nama:"Persatuan Indonesia",lambang:"🌳",simbol:"Pohon beringin",makna:"Menjaga persatuan, mengutamakan kepentingan bersama, dan menghargai keberagaman suku, budaya, bahasa, serta kebiasaan di Indonesia.",contoh:["Bekerja sama dengan semua teman.","Mengikuti upacara dengan tertib.","Menghargai budaya daerah lain."]},
{n:4,nama:"Kerakyatan yang Dipimpin oleh Hikmat Kebijaksanaan dalam Permusyawaratan/Perwakilan",lambang:"🐂",simbol:"Kepala banteng",makna:"Mengutamakan musyawarah untuk mengambil keputusan bersama, mendengarkan pendapat orang lain, dan melaksanakan hasil keputusan dengan tanggung jawab.",contoh:["Bermusyawarah memilih ketua kelas.","Mendengarkan pendapat teman sampai selesai.","Menerima keputusan bersama dengan lapang dada."]},
{n:5,nama:"Keadilan Sosial bagi Seluruh Rakyat Indonesia",lambang:"🌾",simbol:"Padi dan kapas",makna:"Bersikap adil, menghormati hak orang lain, bekerja keras, dan ikut menjaga kesejahteraan bersama.",contoh:["Membagi tugas kelompok secara adil.","Mengantre sesuai urutan.","Menjaga fasilitas sekolah agar dapat digunakan bersama."]}
];
const qs=[
{q:"Lambang sila pertama Pancasila adalah …",a:["Rantai","Bintang","Padi dan kapas","Kepala banteng"],c:1,w:"Bintang melambangkan sila pertama, Ketuhanan Yang Maha Esa."},
{q:"Menolong teman yang terjatuh tanpa membeda-bedakan mencerminkan sila …",a:["Pertama","Kedua","Ketiga","Keempat"],c:1,w:"Sila kedua mengajarkan kepedulian dan perlakuan yang manusiawi."},
{q:"Lambang sila ketiga adalah …",a:["Pohon beringin","Bintang","Rantai","Padi dan kapas"],c:0,w:"Pohon beringin melambangkan Persatuan Indonesia."},
{q:"Kelas berdiskusi untuk menentukan ketua kelas. Sikap yang tepat adalah …",a:["Memaksakan pilihan sendiri","Bermusyawarah dan menghargai pendapat","Tidak mau ikut berdiskusi","Bertengkar dengan teman"],c:1,w:"Musyawarah dan menghargai pendapat mencerminkan sila keempat."},
{q:"Membagi tugas piket secara seimbang mencerminkan sila …",a:["Kedua","Ketiga","Keempat","Kelima"],c:3,w:"Pembagian tugas yang adil merupakan pengamalan sila kelima."},
{q:"Lambang sila kedua adalah …",a:["Bintang","Rantai","Kepala banteng","Pohon beringin"],c:1,w:"Rantai merupakan lambang sila Kemanusiaan yang Adil dan Beradab."},
{q:"Saat teman berbeda agama sedang beribadah, kita sebaiknya …",a:["Mengganggu","Mengolok-olok","Menghormati","Memaksa ikut ibadah kita"],c:2,w:"Menghormati ibadah orang lain mencerminkan sila pertama."},
{q:"Lambang sila kelima adalah …",a:["Padi dan kapas","Rantai","Bintang","Kepala banteng"],c:0,w:"Padi dan kapas melambangkan sila Keadilan Sosial bagi Seluruh Rakyat Indonesia."}
];
const activities=[
{title:"Cocokkan sila dengan lambangnya",desc:"Pilih lambang yang sesuai.",q:"Sila keempat: Kerakyatan dalam Permusyawaratan/Perwakilan",a:["⭐ Bintang","🐂 Kepala banteng","🌳 Pohon beringin","🌾 Padi dan kapas"],c:1,why:"Kepala banteng adalah lambang sila keempat."},
{title:"Pilih perilaku yang sesuai",desc:"Kenali contoh pengamalan nilai Pancasila.",q:"Perilaku yang mencerminkan Persatuan Indonesia adalah …",a:["Bekerja sama dengan semua teman","Memilih teman dari kelompok sendiri","Mengejek budaya daerah lain","Menolak kerja kelompok"],c:0,why:"Bekerja sama dengan semua teman memperkuat persatuan."},
{title:"Kenali makna sila",desc:"Hubungkan situasi dengan sila yang tepat.",q:"Warga kelas bermusyawarah membuat kesepakatan kelas. Ini mencerminkan sila …",a:["Pertama","Kedua","Keempat","Kelima"],c:2,why:"Musyawarah untuk mengambil keputusan bersama mencerminkan sila keempat."}
];
let page="home",qi=0,score=0,answered=false,ai=0;
const el=document.getElementById("content");
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>go(b.dataset.page));
function go(p){page=p;document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===p));render()}
function render(){if(page==="home"){el.innerHTML=`<div class="hero"><div><span class="tag">Ayo belajar bersama!</span><h2>Makna Sila Pancasila</h2><p class="lead">Halo, peserta didik kelas VI! Mari mengenal lima sila Pancasila, lambang-lambangnya, maknanya, dan contoh pengamalannya di rumah, sekolah, serta masyarakat.</p><p>🎯 <b>Misi belajar:</b> pelajari materi, coba aktivitas, kerjakan kuis, lalu renungkan kebiasaan baik yang dapat kamu lakukan.</p><button class="btn" onclick="go('materi')">Mulai Belajar →</button></div><div class="hero-art"><div class="eagle">🦅</div><h3>Garuda Pancasila</h3><p>Berbeda-beda, tetap satu!</p><div style="font-size:2rem">⭐ 🔗 🌳 🐂 🌾</div></div></div><div class="note"><b>Tujuan pembelajaran:</b> mengidentifikasi lima sila dan lambangnya, menjelaskan makna setiap sila, serta memilih perilaku yang sesuai dengan nilai Pancasila.</div>`}
if(page==="materi"){el.innerHTML=`<h2>📚 Kenali Lima Sila Pancasila</h2><p>Pilih kartu untuk membaca makna dan contoh penerapan sila tersebut.</p><div class="grid">${sila.map((s,i)=>`<article class="card"><div class="symbol">${s.lambang}</div><span class="tag">Sila ke-${s.n} • ${s.simbol}</span><h3>${s.nama}</h3><button class="btn alt" onclick="detail(${i})">Pelajari makna</button><div id="d${i}" hidden></div></article>`).join("")}</div><div class="note"><b>Catatan:</b> ikon di kartu merupakan bantuan visual. Saat mengajar, gunakan gambar resmi lambang pada perisai Garuda Pancasila untuk memastikan bentuk simbol dipelajari secara akurat.</div>`}
if(page==="aktivitas")drawActivity();if(page==="kuis")drawQuiz();
if(page==="refleksi"){el.innerHTML=`<h2>🌱 Refleksi: Aku Mengamalkan Pancasila</h2><p>Centang kebiasaan yang sudah kamu lakukan atau ingin kamu biasakan. Jawablah dengan jujur.</p><div class="activity">${["Saya menghormati teman yang berbeda agama atau kepercayaan.","Saya membantu teman yang membutuhkan.","Saya bekerja sama tanpa membeda-bedakan teman.","Saya mendengarkan pendapat saat berdiskusi.","Saya bersikap adil dan menjaga fasilitas bersama."].map(t=>`<label class="check"><input type="checkbox"> ${t}</label>`).join("")}<button class="btn" onclick="document.getElementById('refmsg').textContent='Terima kasih sudah berefleksi! Ayo praktikkan nilai Pancasila setiap hari.'">Selesai Refleksi</button><p id="refmsg" class="feedback"></p></div><button class="btn alt" onclick="go('home')">Kembali ke Beranda</button>`}}
function detail(i){const s=sila[i],d=document.getElementById("d"+i);d.hidden=false;d.innerHTML=`<div class="detail"><b>Makna:</b> ${s.makna}<p><b>Contoh pengamalan:</b></p><ul>${s.contoh.map(x=>`<li>${x}</li>`).join("")}</ul><button class="btn alt" onclick="this.parentElement.parentElement.hidden=true">Tutup</button></div>`}
function drawActivity(){let a=activities[ai];el.innerHTML=`<h2>🧩 Aktivitas Interaktif</h2><div class="progress"><span style="width:${(ai+1)/activities.length*100}%"></span></div><span class="tag">Aktivitas ${ai+1} dari ${activities.length}</span><h3>${a.title}</h3><p>${a.desc}</p><div class="activity"><b>${a.q}</b><div class="options">${a.a.map((x,i)=>`<button class="option" onclick="checkAct(${i})">${x}</button>`).join("")}</div><p id="af" class="feedback"></p><button class="btn" onclick="nextAct()">${ai===activities.length-1?"Ulangi Aktivitas":"Aktivitas Berikutnya →"}</button></div>`}
function checkAct(i){let a=activities[ai];document.querySelectorAll(".option").forEach((b,j)=>{b.disabled=true;if(j===a.c)b.classList.add("correct");if(j===i&&i!==a.c)b.classList.add("wrong")});document.getElementById("af").textContent=(i===a.c?"Benar! ":"Belum tepat. ")+a.why}
function nextAct(){ai=(ai+1)%activities.length;drawActivity()}
function drawQuiz(){if(qi>=qs.length){el.innerHTML=`<h2>🏆 Hasil Kuis</h2><h3>Skor kamu: ${Math.round(score/qs.length*100)} dari 100</h3><p>Kamu menjawab benar ${score} dari ${qs.length} soal.</p><p>${score>=7?"Hebat! Pemahamanmu sangat baik.":"Tetap semangat! Baca kembali materi dan coba lagi."}</p><button class="btn" onclick="qi=0;score=0;answered=false;go('kuis')">Ulangi Kuis</button> <button class="btn alt" onclick="go('materi')">Pelajari Materi Lagi</button>`;return}let q=qs[qi];el.innerHTML=`<h2>✍️ Kuis Pemahaman</h2><p>Pilih satu jawaban yang paling tepat.</p><div class="progress"><span style="width:${qi/qs.length*100}%"></span></div><span class="tag">Soal ${qi+1} dari ${qs.length}</span><h3>${q.q}</h3><div class="options">${q.a.map((x,i)=>`<button class="option" onclick="answer(${i})">${String.fromCharCode(65+i)}. ${x}</button>`).join("")}</div><p id="qf" class="feedback"></p><button id="nq" class="btn" onclick="nextQ()" disabled>${qi===qs.length-1?"Lihat Hasil":"Soal Berikutnya →"}</button>`}
function answer(i){if(answered)return;answered=true;let q=qs[qi];if(i===q.c)score++;document.querySelectorAll(".option").forEach((b,j)=>{b.disabled=true;if(j===q.c)b.classList.add("correct");if(j===i&&i!==q.c)b.classList.add("wrong")});document.getElementById("qf").textContent=(i===q.c?"Benar! ":"Belum tepat. ")+q.w;document.getElementById("nq").disabled=false}
function nextQ(){qi++;answered=false;drawQuiz()}
render();
</script></body></html>
